name: Build experimental Preset C Lite DX12 proxy
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/fg_lite_provider/**'
      - '.github/workflows/fg-lite-dx12-proxy.yml'
    branches: [fix/fg-lite-create-parameter-pin]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Acquire NVIDIA NGX SDK public headers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ngx-sdk | Out-Null
          $base = 'https://raw.githubusercontent.com/NVIDIA-RTX/Streamline/main/external/ngx-sdk/include/'
          foreach ($f in @('nvsdk_ngx_defs.h', 'nvsdk_ngx_params.h')) {
            Invoke-WebRequest -Uri ($base + $f) -OutFile ('ngx-sdk/' + $f)
          }
      - name: Compile x64 custom NGX provider (MSVC)
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          cl /nologo /std:c++20 /EHsc /MT /O2 /W4 /LD /I ngx-sdk experiments\fg_lite_provider\preset_c_proxy.cpp /link /OUT:nvngx_dlssg.dll user32.lib
          if errorlevel 1 exit /b 1
          dumpbin /exports nvngx_dlssg.dll > exports.txt
          findstr /c:"NVSDK_NGX_D3D12_CreateFeature" exports.txt
          if errorlevel 1 exit /b 1
      - name: Package OptiScaler custom provider (no NVIDIA runtime bundled)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'dist/custom/PresetCLite/dlssg' | Out-Null
          Copy-Item 'nvngx_dlssg.dll' 'dist/custom/PresetCLite/dlssg/'
          Copy-Item 'experiments/fg_lite_provider/PresetCLite.ini' 'dist/custom/PresetCLite/dlssg/'
          Copy-Item 'experiments/fg_lite_provider/README.md' 'dist/'
          Copy-Item 'exports.txt' 'dist/'
          Compress-Archive -Path 'dist/*' -DestinationPath 'PresetCLite-OptiScaler-EXPERIMENTAL.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: PresetCLite-OptiScaler-EXPERIMENTAL
          path: PresetCLite-OptiScaler-EXPERIMENTAL.zip
          retention-days: 30
